name: Build VcamFullMay

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "VcamFullMay/**"
      - ".github/workflows/build-vcam.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: rootless
      SDK_VERSION: "16.5"
      SDK_RELEASE: "master-146e41f"
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      - name: Cache Theos + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-v4-sdk${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE }}

      - name: Install Theos + SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Verify Theos
        run: |
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/sdks/"

      - name: Build VcamFullMay tweak
        run: |
          set -euo pipefail
          cd VcamFullMay
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/
          test -n "$(ls packages/*.deb 2>/dev/null)"

      - name: Patch install_name + filter plist (rootless compat)
        run: |
          set -euo pipefail
          cd VcamFullMay
          DEB=$(ls packages/*.deb | head -1)
          echo "Original .deb: $DEB"

          rm -rf /tmp/deb-work
          mkdir -p /tmp/deb-work
          dpkg-deb -R "$DEB" /tmp/deb-work

          DEPLOYED=$(find /tmp/deb-work -name "VcamFullMay.dylib" | head -1)
          test -n "$DEPLOYED" || { echo "ERR: no dylib in .deb"; exit 1; }

          echo "=== before patch ==="
          otool -D "$DEPLOYED" || true
          otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit' || true

          # install_name → absolute deploy path so ellekit/substrate scanner
          # matches it against the path it found the dylib at.
          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/VcamFullMay.dylib" \
            "$DEPLOYED"

          # CydiaSubstrate.framework → libsubstrate.dylib (ellekit alias)
          if otool -L "$DEPLOYED" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$DEPLOYED"
          fi

          ldid -S "$DEPLOYED"

          echo "=== after patch ==="
          otool -D "$DEPLOYED"
          otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit' || true

          # Convert filter plist to XML (Dopamine ellekit needs XML for complex rules)
          PLIST=$(find /tmp/deb-work -name "*.plist" | grep -v DEBIAN | head -1)
          if [ -n "$PLIST" ]; then
            plutil -convert xml1 "$PLIST"
          fi

          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/deb-work "$DEB"
          ls -lh packages/

      - name: Verify tweak dylib
        run: |
          set -euo pipefail
          cd VcamFullMay
          rm -rf /tmp/vcam-verify
          dpkg-deb -x packages/*.deb /tmp/vcam-verify
          DYLIB=$(find /tmp/vcam-verify -name "VcamFullMay.dylib" | head -1)
          test -n "$DYLIB" || { echo "ERR: no dylib"; exit 1; }
          echo "=== arch slices ==="
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -qE 'arm64.*arm64e|arm64e.*arm64' || { echo "ERR: missing arm64e"; exit 1; }
          echo "=== linked frameworks ==="
          otool -L "$DYLIB"
          echo "=== install_name ==="
          INSTALL_NAME=$(otool -D "$DYLIB" | tail -1)
          EXPECTED="/var/jb/Library/MobileSubstrate/DynamicLibraries/VcamFullMay.dylib"
          test "$INSTALL_NAME" = "$EXPECTED" || { echo "ERR: install_name wrong"; exit 1; }

      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VcamFullMay
          path: VcamFullMay/packages/*.deb
          retention-days: 14

name: Build HIOS Faker v3 — roothide

on:
  workflow_dispatch:
  push:
    branches:
      - roothide
    paths:
      - "roothide/tweak-mg/**"
      - "roothide/tweak-ct/**"
      - "roothide/ci_configsync.sh"
      - "app/**"
      - ".github/workflows/build-roothide.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: roothide
      SDK_VERSION: "16.5"
      SDK_RELEASE: "master-146e41f"

    steps:
      - uses: actions/checkout@v4

      - name: Init build log
        run: |
          mkdir -p /tmp
          echo "=== roothide build $(date) sha=${GITHUB_SHA} ===" > /tmp/build.log

      - name: Install ldid + dpkg
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          brew install ldid dpkg

      - name: Cache Theos + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-rh-roothide-sdk${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE }}

      - name: Install Theos + SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          set -euo pipefail
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Build tweak-mg (roothide)
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          set -euo pipefail
          cd roothide/tweak-mg
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64"
          DEB=$(ls packages/*.deb | head -1)
          echo "Built: $DEB"
          ls -lh packages/

      - name: Build tweak-ct (roothide)
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          set -euo pipefail
          cd roothide/tweak-ct
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64"
          DEB=$(ls packages/*.deb | head -1)
          echo "Built: $DEB"
          ls -lh packages/

      - name: Build app (roothide)
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          set -euo pipefail
          cd app
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64"
          DEB=$(ls packages/*.deb | head -1)
          echo "Built: $DEB"
          ls -lh packages/

      - name: Combine into single deb
        run: |
          set -euo pipefail
          MG=$(ls roothide/tweak-mg/packages/*.deb | head -1)
          CT=$(ls roothide/tweak-ct/packages/*.deb | head -1)
          APP=$(ls app/packages/*.deb | head -1)
          echo "MG: $MG"
          echo "CT: $CT"
          echo "APP: $APP"

          rm -rf combined /tmp/mg-x /tmp/ct-x /tmp/app-x
          mkdir -p combined/DEBIAN /tmp/mg-x /tmp/ct-x /tmp/app-x
          dpkg-deb -x "$MG" /tmp/mg-x
          dpkg-deb -x "$CT" /tmp/ct-x
          dpkg-deb -x "$APP" /tmp/app-x
          cp -R /tmp/mg-x/. combined/
          cp -R /tmp/ct-x/. combined/
          cp -R /tmp/app-x/. combined/

          # Stage ALL MobileSubstrate content (dylibs + plists) outside
          # DynamicLibraries so Sileo has nothing to detect as a substrate
          # tweak → Get Patcher never fires. postinst deploys everything
          # to DynamicLibraries after dpkg extracts the package.
          mkdir -p combined/etc/changeinfoios
          for F in combined/Library/MobileSubstrate/DynamicLibraries/*.dylib \
                   combined/Library/MobileSubstrate/DynamicLibraries/*.plist; do
            [ -f "$F" ] || continue
            mv "$F" combined/etc/changeinfoios/
            echo "Staged: $(basename $F)"
          done
          # Remove MobileSubstrate directory entirely so Sileo cannot
          # detect any substrate content in the payload.
          rm -rf combined/Library/MobileSubstrate
          rm -rf combined/Library 2>/dev/null || true

          # Sign the dylibs (now in staging path)
          for DYLIB in \
              combined/etc/changeinfoios/ChangeInfoIosMG.dylib \
              combined/etc/changeinfoios/ChangeInfoIosCT.dylib; do
            [ -f "$DYLIB" ] || continue
            ldid -S "$DYLIB"
          done

          # Copy config sync daemon script into staging
          cp roothide/ci_configsync.sh combined/etc/changeinfoios/ci_configsync.sh
          chmod 0755 combined/etc/changeinfoios/ci_configsync.sh

          # Sign the app binary with entitlements
          APP_BIN="combined/Applications/HIOSFakerV3.app/HIOSFakerV3"
          if [ -f "$APP_BIN" ]; then
            ldid -Sapp/entitlements.plist "$APP_BIN"
            echo "Signed app with entitlements"
          fi

          VERSION=$(grep '^Version:' roothide/tweak-mg/control | awk '{print $2}')

          # Auto-sync app Info.plist version from control file
          APP_PLIST="combined/Applications/HIOSFakerV3.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            BVER=$(echo "$VERSION" | tr -d '.')
            LC_ALL=C sed -i '' "/<key>CFBundleShortVersionString<\/key>/{n;s|<string>[^<]*</string>|<string>${VERSION}</string>|;}" "$APP_PLIST"
            LC_ALL=C sed -i '' "/<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>${BVER}</string>|;}" "$APP_PLIST"
            echo "Patched Info.plist → ${VERSION} / ${BVER}"
          fi

          cat > combined/DEBIAN/postinst <<'POSTINST'
          #!/bin/sh
          set -e
          # roothide uses jbroot to resolve randomized paths;
          # JBROOT env is unreliable in postinst context.
          if command -v jbroot >/dev/null 2>&1; then
            ROOT="$(jbroot / 2>/dev/null)" || ROOT="${JBROOT:-/var/jb}"
          else
            ROOT="${JBROOT:-/var/jb}"
          fi
          # Strip trailing slash
          ROOT="${ROOT%/}"

          # /var/jb compatibility shim: the app uses hardcoded /var/jb paths.
          # On roothide the jbroot is a randomized path, but the bootstrap
          # overlays it onto /, so /var/jb -> / makes all paths resolve correctly.
          if [ -d /var/jb ] && [ ! -L /var/jb ]; then
            rm -rf /var/jb
          fi
          if [ ! -e /var/jb ]; then
            ln -s / /var/jb
          fi

          MS="$ROOT/Library/MobileSubstrate/DynamicLibraries"
          ETC="$ROOT/etc/changeinfoios"
          mkdir -p "$MS"  2>/dev/null || true
          mkdir -p "$ETC" 2>/dev/null || true
          for F in ChangeInfoIosMG.dylib ChangeInfoIosCT.dylib \
                   ChangeInfoIosMG.plist ChangeInfoIosCT.plist; do
            SRC="$ETC/$F"
            DST="$MS/$F"
            [ -f "$SRC" ] || continue
            cp "$SRC" "$DST"
            chown root:wheel "$DST" 2>/dev/null || true
            case "$F" in
              *.dylib) chmod 0755 "$DST" 2>/dev/null || true ;;
              *.plist) chmod 0666 "$DST" 2>/dev/null || true ;;
              *)       chmod 0644 "$DST" 2>/dev/null || true ;;
            esac
          done
          for P in "$MS/ChangeInfoIosMG.plist" "$MS/ChangeInfoIosCT.plist"; do
            [ -f "$P" ] || continue
            sed -i '' '/<string>com\.apple\.weather<\/string>/d' "$P" 2>/dev/null || true
          done
          chmod 0777 "$ETC" 2>/dev/null || true

          # ── Config REAL-FILE bridge for roothide ──
          # On roothide, sandbox blocks following symlinks across containers.
          # CFPreferences scopes writes to the calling app's container, so each
          # target app sees DIFFERENT stale data — the 3-apps-3-results bug.
          # Fix: COPY the mirror as a REAL FILE to $ETC/config.plist (jbroot
          # path, readable by all processes on roothide) instead of symlinking.
          # The app's S6 write updates this same real file at runtime.
          HIOS_CONTAINER=""
          for uuid_dir in /var/mobile/Containers/Data/Application/*/; do
            meta="${uuid_dir}.com.apple.mobile_container_manager.metadata.plist"
            [ -f "$meta" ] || continue
            if plutil "$meta" 2>/dev/null | grep -q "com.changeinfoios.v3.app"; then
              HIOS_CONTAINER="${uuid_dir%/}"
              break
            fi
          done
          # Remove any stale symlinks from previous builds
          SHARED="/var/mobile/Library/Preferences/com.changeinfoios.plist"
          [ -L "$SHARED" ] && rm -f "$SHARED" 2>/dev/null || true
          [ -L "$ETC/config.plist" ] && rm -f "$ETC/config.plist" 2>/dev/null || true
          if [ -n "$HIOS_CONTAINER" ]; then
            MIRROR="$HIOS_CONTAINER/Documents/ci_config_mirror.plist"
            if [ -f "$MIRROR" ]; then
              cp -f "$MIRROR" "$ETC/config.plist" 2>/dev/null || true
              chmod 0666 "$ETC/config.plist" 2>/dev/null || true
              chown mobile:mobile "$ETC/config.plist" 2>/dev/null || true
              cp -f "$MIRROR" "$SHARED" 2>/dev/null || true
              chmod 0666 "$SHARED" 2>/dev/null || true
              chown mobile:mobile "$SHARED" 2>/dev/null || true
            fi
          fi
          rm -f "$ETC/v3_mg_loaded.txt" "$ETC/v3_ct_loaded.txt" \
                "$ETC/v3_mg_debug.log" 2>/dev/null || true
          JBCTL=""
          for c in "$ROOT/basebin/jbctl" "$ROOT/usr/bin/jbctl" \
                   /usr/bin/jbctl /basebin/jbctl; do
            [ -x "$c" ] && JBCTL="$c" && break
          done
          LDID=""
          for l in "$ROOT/usr/bin/ldid" /usr/bin/ldid; do
            [ -x "$l" ] && LDID="$l" && break
          done
          if [ -n "$JBCTL" ]; then
            for D in "$MS/ChangeInfoIosMG.dylib" "$MS/ChangeInfoIosCT.dylib" \
                     "$ROOT/Applications/HIOSFakerV3.app/HIOSFakerV3"; do
              [ -f "$D" ] || continue
              # Re-sign on-device so CDHash is sha256-only;
              # CI ldid produces sha1+sha256 dual which jbctl ignores.
              [ -n "$LDID" ] && "$LDID" -S "$D" 2>/dev/null || true
              "$JBCTL" trustcache add "$D" 2>/dev/null || true
            done
          fi
          # Register app icon on SpringBoard
          UICACHE=""
          for u in "$ROOT/usr/bin/uicache" /usr/bin/uicache; do
            [ -x "$u" ] && UICACHE="$u" && break
          done
          if [ -n "$UICACHE" ]; then
            "$UICACHE" -p "$ROOT/Applications/HIOSFakerV3.app" 2>/dev/null || true
          fi
          # ── WatchPaths config-sync daemon ──
          SYNC_SCRIPT="$ETC/ci_configsync.sh"
          chmod 0755 "$SYNC_SCRIPT" 2>/dev/null || true
          LD_DIR="$ROOT/Library/LaunchDaemons"
          LD_PLIST="$LD_DIR/com.changeinfoios.configsync.plist"
          mkdir -p "$LD_DIR" 2>/dev/null || true
          cat > "$LD_PLIST" <<LDEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.changeinfoios.configsync</string>
            <key>ProgramArguments</key>
            <array>
              <string>/bin/sh</string>
              <string>$SYNC_SCRIPT</string>
            </array>
            <key>WatchPaths</key>
            <array>
              <string>/tmp/com.changeinfoios.config.plist</string>
            </array>
            <key>RunAtLoad</key>
            <false/>
          </dict>
          </plist>
          LDEOF
          launchctl bootout system/com.changeinfoios.configsync 2>/dev/null || true
          launchctl bootstrap system "$LD_PLIST" 2>/dev/null || \
            launchctl load "$LD_PLIST" 2>/dev/null || true
          sh "$SYNC_SCRIPT" 2>/dev/null &
          exit 0
          POSTINST
          chmod 0755 combined/DEBIAN/postinst

          cat > combined/DEBIAN/prerm <<'PRERM'
          #!/bin/sh
          launchctl bootout system/com.changeinfoios.configsync 2>/dev/null || true
          if command -v jbroot >/dev/null 2>&1; then
            R="$(jbroot / 2>/dev/null)" || R="${JBROOT:-/var/jb}"
          else
            R="${JBROOT:-/var/jb}"
          fi
          R="${R%/}"
          rm -f "$R/Library/LaunchDaemons/com.changeinfoios.configsync.plist" 2>/dev/null || true
          exit 0
          PRERM
          chmod 0755 combined/DEBIAN/prerm

          cat > combined/DEBIAN/control <<EOF
          Package: com.changeinfoios.v3
          Name: HIOS Faker v3 (Roothide)
          Version: ${VERSION}
          Architecture: iphoneos-arm64e
          Description: HIOS Faker v3 for Roothide jailbreak. MobileGestalt + CoreTelephony device-spoof injected into selected apps. Requires roothide bootstrap (opa334).
          Maintainer: ChangeInfoIos
          Author: @houselis
          Section: System
          Depends: firmware (>= 15.0)
          Conflicts: com.changeinfoios.tweak, com.changeinfoios.bundle
          EOF

          mkdir -p out
          dpkg-deb -Zxz -b combined "out/ChangeInfoIos-v3-roothide_${VERSION}_iphoneos-arm64e.deb"
          echo "=== combined deb ==="
          ls -lh out/
          dpkg-deb -I out/*.deb

      - name: Show payload tree
        run: find combined -type f -o -type l | sort

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-v3-roothide
          path: out/*.deb
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/roothide'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^Version:' roothide/tweak-mg/control | awk '{print $2}')
          TAG="rh-${VERSION}-${GITHUB_SHA::7}"
          gh release create "$TAG" out/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "HIOS Faker v3 Roothide ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Roothide build from ${GITHUB_SHA}. Requires opa334 roothide bootstrap. Install via Sileo source https://zalosuper.net/roothide/"

      - name: Auto-publish deb to Sileo roothide folder
        if: success() && github.ref == 'refs/heads/roothide'
        env:
          SILEO_PAT: ${{ secrets.SILEO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SILEO_PAT:-}" ]; then
            echo "SILEO_DEPLOY_TOKEN not set — skipping auto-publish."
            exit 0
          fi
          DEB=$(ls out/*.deb | head -1)
          BN=$(basename "$DEB")
          echo "Publishing $BN to roothide Sileo pool…"
          git clone --depth 1 "https://x-access-token:${SILEO_PAT}@github.com/Hieudeptrai04/hieudeptrai04.github.io.git" sileo_repo
          cp "$DEB" "sileo_repo/roothide/pool/main/$BN"
          cd sileo_repo
          git config user.name "HIOS CI"
          git config user.email "ci@users.noreply.github.com"
          git add "roothide/pool/main/$BN"
          if git diff --cached --quiet; then
            echo "$BN already in pool."
          else
            git commit -m "auto-publish roothide $BN from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin HEAD:main
            echo "Pushed $BN to roothide pool."
          fi

      - name: On failure — publish build.log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          tail -200 /tmp/build.log
          [ -s /tmp/build.log ] || echo "(empty)" > /tmp/build.log
          TAG="debug-rh-fail-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          gh release create "$TAG" /tmp/build.log \
            --repo "$GITHUB_REPOSITORY" \
            --title "DEBUG roothide fail ${GITHUB_SHA::7}" \
            --notes "Auto-uploaded failure log. SHA=${GITHUB_SHA}" \
            --prerelease || true

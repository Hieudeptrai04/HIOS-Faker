name: Test Theos Build

on:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/
          echo "SDK OK" && ls -la $HOME/theos/sdks/
      - name: Build tweak
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee build.log
          echo "MAKE EXIT: $?"
      - name: Check result
        if: always()
        run: |
          echo "=== Build log ==="
          cat tweak/build.log 2>/dev/null || echo "No log"
          echo "=== Packages ==="
          find . -name "*.deb" -type f
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-deb
          path: tweak/packages/*.deb

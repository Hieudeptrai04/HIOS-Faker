name: Test Theos Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Theos
        run: git clone --recursive https://github.com/theos/theos.git $HOME/theos
      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/
          ls -la $HOME/theos/sdks/
      - name: Show tweak files
        run: |
          echo "=== Tweak dir ==="
          ls -la tweak/
          echo ""
          echo "=== Makefile ==="
          cat tweak/Makefile
      - name: Build tweak
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64
      - name: Check result
        run: |
          find . -name "*.deb" -type f -exec ls -lh {} \;

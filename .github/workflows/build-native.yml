# Build tweak + app on macOS

name: Build iOS Tweak (Native)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "tweak/**"
      - "app/**"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== tweak files ==="
          ls -la tweak/
          echo ""
          echo "=== app files ==="
          ls -la app/ 2>/dev/null || echo "No app dir"

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git submodule update --init --recursive
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          if ! command -v ldid &>/dev/null; then
            brew install ldid
          fi
          which ldid && ldid -v

      - name: Download SDK
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          rm -f /tmp/sdk.tar.xz
          ls -la "$THEOS/sdks/"

      # BUILD TWEAK
      - name: Build tweak
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee "$GITHUB_WORKSPACE/tweak_output.txt"
          echo "Exit: $?"
          ls -la packages/ 2>/dev/null || echo "No packages"
          find . -name "*.deb" -type f

      # BUILD APP
      - name: Build app
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd app
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee "$GITHUB_WORKSPACE/app_output.txt"
          echo "Exit: $?"
          ls -la packages/ 2>/dev/null || echo "No packages"
          find . -name "*.deb" -type f

      # SHOW OUTPUTS
      - name: Show build outputs
        run: |
          echo "=== tweak output ==="
          tail -20 "$GITHUB_WORKSPACE/tweak_output.txt"
          echo ""
          echo "=== app output ==="
          tail -20 "$GITHUB_WORKSPACE/app_output.txt"
          echo ""
          echo "=== All debs ==="
          find "$GITHUB_WORKSPACE" -name "*.deb" -type f -exec ls -lh {} \;

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/tweak_output.txt
            ${{ github.workspace }}/app_output.txt
          retention-days: 7

      # COMBINE
      - name: Combine packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/combined/DEBIAN"
          mkdir -p "$GITHUB_WORKSPACE/combined/var/jb/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$GITHUB_WORKSPACE/combined/var/jb/Applications"

          # Extract tweak
          TWEAK=$(find "$GITHUB_WORKSPACE/tweak" -name "*.deb" -type f | head -1)
          echo "Tweak deb: $TWEAK"
          if [ -n "$TWEAK" ]; then
            dpkg-deb -x "$TWEAK" /tmp/tweak-extract
            ls -la /tmp/tweak-extract/
            cp -r /tmp/tweak-extract/var/jb/Library/MobileSubstrate/DynamicLibraries/* \
                  "$GITHUB_WORKSPACE/combined/var/jb/Library/MobileSubstrate/DynamicLibraries/" 2>/dev/null || true
          fi

          # Extract app
          APP=$(find "$GITHUB_WORKSPACE/app" -name "*.deb" -type f | head -1)
          echo "App deb: $APP"
          if [ -n "$APP" ]; then
            dpkg-deb -x "$APP" /tmp/app-extract
            ls -la /tmp/app-extract/
            cp -r /tmp/app-extract/var/jb/Applications/* \
                  "$GITHUB_WORKSPACE/combined/var/jb/Applications/" 2>/dev/null || true
            cp -r /tmp/app-extract/Applications/* \
                  "$GITHUB_WORKSPACE/combined/var/jb/Applications/" 2>/dev/null || true
          fi

          echo "=== Combined contents ==="
          find "$GITHUB_WORKSPACE/combined" -type f

      - name: Create final deb
        run: |
          cat > "$GITHUB_WORKSPACE/combined/DEBIAN/control" << 'EOF'
Package: com.changeinfoios.tweak
Name: ChangeInfoIos
Version: 2.2.1-native
Architecture: iphoneos-arm64
Description: Device spoofer for iOS 15-16.7. Native UI + 92 hooks.
Maintainer: ChangeInfoIos
Section: Tweaks
Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0)
EOF

          chmod 755 "$GITHUB_WORKSPACE/combined/DEBIAN/control"
          mkdir -p "$GITHUB_WORKSPACE/packages"

          dpkg-deb -b "$GITHUB_WORKSPACE/combined" "$GITHUB_WORKSPACE/packages/ChangeInfoIos.deb"

          SIZE=$(stat -f%z "$GITHUB_WORKSPACE/packages/ChangeInfoIos.deb")
          echo "Final size: $SIZE bytes"
          ls -lh "$GITHUB_WORKSPACE/packages/"

          if [ $SIZE -lt 100000 ]; then
            echo "WARNING: Deb is small ($SIZE bytes)"
            find "$GITHUB_WORKSPACE/combined" -type f -exec ls -lh {} \;
          fi

      - name: Upload final deb
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-v2.2.1-native
          path: packages/ChangeInfoIos.deb
          retention-days: 30

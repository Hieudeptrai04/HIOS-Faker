# Build native iOS tweak .deb on macOS
# Compile dylib via Theos + real iOS SDK


name: Build iOS Tweak (Native)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "tweak/**"
      - ".github/workflows/build-native.yml"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tweak source files
        run: |
          echo "=== Tweak source files ==="
          ls -la tweak/
          echo ""
          echo "Tweak.xm lines: $(wc -l < tweak/Tweak.xm)"
          echo "Makefile:"
          cat tweak/Makefile

      - name: Install Xcode Command Line Tools
        run: |
          if ! xcode-select -p > /dev/null 2>&1; then
            echo "Installing Xcode Command Line Tools..."
            xcode-select --install
            while ! xcode-select -p > /dev/null 2>&1; do
              sleep 5
            done
          fi
          echo "Xcode path: $(xcode-select -p)"
          clang --version
          llvm-strip --version || true

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS"
          if [ ! -d "$THEOS" ]; then
            echo "Cloning Theos..."
            git clone https://github.com/theos/theos.git "$THEOS"
          else
            echo "Theos already exists, updating..."
            cd "$THEOS" && git pull
          fi
          cd "$THEOS"
          echo "Running git submodule update..."
          git submodule update --init --recursive 2>&1 | tail -5
          echo "=== Theos bin ==="
          ls -la "$THEOS/bin/"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          if ! command -v ldid &>/dev/null; then
            echo "Installing ldid via brew..."
            brew install ldid 2>&1 | tail -3
          fi
          which ldid && ldid -v || echo "ldid not found"

      - name: Download iOS SDK
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "Downloading iOS SDK 16.5..."
            curl -fSL \
              "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
              -o /tmp/sdk.tar.xz
            echo "Downloaded: $(ls -lh /tmp/sdk.tar.xz)"
            tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
            rm -f /tmp/sdk.tar.xz
          else
            echo "SDK already exists, skipping download"
          fi
          echo "=== Available SDKs ==="
          ls -la "$THEOS/sdks/"

      - name: Verify SDK contents
        run: |
          export THEOS="$HOME/theos"
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "=== SDK verification ==="
          echo "SDK exists: $(test -d $SDK && echo YES || echo NO)"
          echo "Frameworks: $(ls $SDK/System/Library/Frameworks/ 2>/dev/null | head -5)"

      - name: Build rootless tweak
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
          THEOS_DEVICE_ARCH: arm64
        run: |
          export THEOS="$HOME/theos"
          cd "${GITHUB_WORKSPACE}/tweak"

          echo "=== Cleaning old build artifacts ==="
          make clean THEOS="$THEOS" 2>&1 || true
          rm -rf packages/ .theos/ obj/ 2>/dev/null || true

          echo ""
          echo "=== Building tweak ==="
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          BUILD_STATUS=$?
          echo ""
          echo "=== Build exit status: $BUILD_STATUS ==="

          echo "=== Checking for .deb files ==="
          find . -name "*.deb" -type f -exec ls -lh {} \;

          DEB_COUNT=$(find . -name "*.deb" -type f | wc -l)
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: No .deb file produced!"
            ls -la packages/ 2>/dev/null || echo "No packages dir"
            ls -la obj/ 2>/dev/null || echo "No obj dir"
            exit 1
          fi

          DEB_SIZE=$(find . -name "*.deb" -type f -exec stat -f%z {} \; | head -1)
          echo "DEB size: $DEB_SIZE bytes"
          if [ "$DEB_SIZE" -lt 100000 ]; then
            echo "ERROR: .deb is too small ($DEB_SIZE bytes). Missing compiled dylib?"
            exit 1
          fi

          echo "=== .deb size OK: $DEB_SIZE bytes ==="

      - name: Inspect .deb contents
        run: |
          DEB=$(find . -name "*.deb" -type f | head -1)
          echo "=== .deb contents ==="
          python3 "${GITHUB_WORKSPACE}/scripts/inspect_deb.py" "$DEB"

      - name: Prepare output packages directory
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/packages"
          DEB_FILE=$(find "${GITHUB_WORKSPACE}/tweak" -name "*.deb" -type f 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "${GITHUB_WORKSPACE}/packages/"
            echo "Copied: $DEB_FILE -> packages/"
            ls -lh "${GITHUB_WORKSPACE}/packages/"
          else
            echo "ERROR: No .deb found!"
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-native-v22
          path: packages/*.deb
          retention-days: 30

name: Build ChangeInfoIos

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tweak/**"
      - "tweak-safari/**"
      - "tweak-location/**"
      - "app/**"
      - "helloinject/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: rootless
      SDK_VERSION: "16.5"
      SDK_RELEASE: "master-146e41f"
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      - name: Cache Theos + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-v4-sdk${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE }}

      - name: Install Theos + SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Verify Theos
        run: |
          set -euo pipefail
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/sdks/"

      - name: Build tweak
        run: |
          set -euo pipefail
          cd tweak
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/
          test -n "$(ls packages/*.deb 2>/dev/null)"

      - name: Patch install_name + CydiaSubstrate (rootless compat)
        run: |
          set -euo pipefail
          cd tweak
          # Two patches in one step (must dpkg-deb repack once):
          #
          # (1) install_name: Theos default sets LC_ID_DYLIB to @rpath/<name>.dylib.
          #     ellekit/substrate validates install_name matches the deploy path
          #     when scanning DynamicLibraries/ — @rpath causes silent skip.
          #     Control sample PreferenceLoader uses absolute path and injects
          #     fine. Fix: install_name_tool -id to absolute deploy path.
          # (2) CydiaSubstrate dep: redundant on ellekit-only devices, but keep
          #     as defensive patch. libsubstrate.dylib is provided by ellekit.
          DEB=$(ls packages/*.deb | head -1)
          echo "Original .deb: $DEB"

          rm -rf /tmp/deb-work
          mkdir -p /tmp/deb-work
          # -R preserves DEBIAN/ control directory alongside payload
          dpkg-deb -R "$DEB" /tmp/deb-work

          DEPLOYED=$(find /tmp/deb-work -name "ChangeInfoIos.dylib" | head -1)
          test -n "$DEPLOYED" || { echo "ERR: no dylib in .deb"; exit 1; }

          echo "=== before patch ==="
          otool -D "$DEPLOYED" || true
          otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit' || true

          # (1) install_name → absolute deploy path
          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIos.dylib" \
            "$DEPLOYED"

          # (2) CydiaSubstrate → libsubstrate.dylib (if still linked)
          if otool -L "$DEPLOYED" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$DEPLOYED"
          fi

          ldid -S "$DEPLOYED"
          echo "=== after patch ==="
          otool -D "$DEPLOYED"
          otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit' || true

          # Convert filter plist to XML because Dopamine ellekit requires it for complex rules
          PLIST=$(find /tmp/deb-work -name "*.plist" | grep -v DEBIAN | head -1)
          if [ -n "$PLIST" ]; then
            plutil -convert xml1 "$PLIST"
          fi

          # Repack .deb in-place (dpkg-deb -b reads DEBIAN/ from the unpacked dir)
          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/deb-work "$DEB"
          ls -lh packages/

      - name: Verify tweak dylib (from patched .deb)
        run: |
          set -euo pipefail
          cd tweak
          # Verify từ .deb cuối cùng (sau patch), không phải .theos/obj gốc
          rm -rf /tmp/tweak-verify
          dpkg-deb -x packages/*.deb /tmp/tweak-verify
          DYLIB=$(find /tmp/tweak-verify -name "ChangeInfoIos.dylib" | head -1)
          test -n "$DYLIB" || { echo "ERR: no dylib in .deb"; exit 1; }
          echo "=== arch slices ==="
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -qE 'arm64.*arm64e|arm64e.*arm64' || { echo "ERR: missing arm64e"; exit 1; }
          echo "=== codesign ==="
          ldid -e "$DYLIB" | head -20 || true
          codesign -dv "$DYLIB" 2>&1 | head -5 || true
          echo "=== linked frameworks ==="
          otool -L "$DYLIB"
          echo "=== install_name check ==="
          INSTALL_NAME=$(otool -D "$DYLIB" | tail -1)
          echo "install_name = $INSTALL_NAME"
          EXPECTED="/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIos.dylib"
          test "$INSTALL_NAME" = "$EXPECTED" || { echo "ERR: install_name wrong (expected $EXPECTED)"; exit 1; }
          echo "=== substrate link check ==="
          if otool -L "$DYLIB" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            echo "ERR: CydiaSubstrate.framework still referenced — patch failed!"
            exit 1
          fi
          otool -L "$DYLIB" | grep -iE 'substrate|ellekit' || { echo "ERR: no substrate link at all"; exit 1; }
          echo "=== undefined symbols ==="
          nm -u "$DYLIB" 2>/dev/null | head -20 || true
          echo "=== filter plist ==="
          FILTER=$(find /tmp/tweak-verify -name "ChangeInfoIos.plist" | head -1)
          test -n "$FILTER" || { echo "ERR: filter plist missing"; exit 1; }
          plutil -lint "$FILTER"
          echo "Filter plist OK (verified XML): $FILTER"

      - name: Build HelloInject (minimal inject probe)
        run: |
          set -euo pipefail
          cd helloinject
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/

          # Same post-build patch as main tweak: install_name → absolute.
          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/hello-work
          mkdir -p /tmp/hello-work
          dpkg-deb -R "$DEB" /tmp/hello-work
          HELLO=$(find /tmp/hello-work -name "HelloInject.dylib" | head -1)
          test -n "$HELLO" || { echo "ERR: HelloInject.dylib missing"; exit 1; }
          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/HelloInject.dylib" \
            "$HELLO"
          ldid -S "$HELLO"
          echo "=== HelloInject after patch ==="
          otool -D "$HELLO"
          otool -L "$HELLO"
          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/hello-work "$DEB"

      - name: Build ChangeInfoIosSafari (sidecar minimal dylib for Safari UA spoof)
        run: |
          set -euo pipefail
          cd tweak-safari
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/

          # Same install_name + CydiaSubstrate patch as the main tweak.
          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/safari-work
          mkdir -p /tmp/safari-work
          dpkg-deb -R "$DEB" /tmp/safari-work
          SAFARI=$(find /tmp/safari-work -name "ChangeInfoIosSafari.dylib" | head -1)
          test -n "$SAFARI" || { echo "ERR: ChangeInfoIosSafari.dylib missing"; exit 1; }

          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosSafari.dylib" \
            "$SAFARI"

          if otool -L "$SAFARI" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$SAFARI"
          fi

          ldid -S "$SAFARI"

          # Convert filter plist to XML for Dopamine ellekit compatibility.
          PLIST=$(find /tmp/safari-work -name "*.plist" | grep -v DEBIAN | head -1)
          if [ -n "$PLIST" ]; then plutil -convert xml1 "$PLIST"; fi

          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/safari-work "$DEB"
          echo "=== Safari sidecar after patch ==="
          otool -D "$SAFARI"
          otool -L "$SAFARI"

      - name: Build ChangeInfoIosLocation (sidecar minimal dylib for Maps/Weather/Camera GPS spoof)
        run: |
          set -euo pipefail
          cd tweak-location
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/

          # Same install_name + CydiaSubstrate patch as the main tweak.
          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/location-work
          mkdir -p /tmp/location-work
          dpkg-deb -R "$DEB" /tmp/location-work
          LOCATION=$(find /tmp/location-work -name "ChangeInfoIosLocation.dylib" | head -1)
          test -n "$LOCATION" || { echo "ERR: ChangeInfoIosLocation.dylib missing"; exit 1; }

          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosLocation.dylib" \
            "$LOCATION"

          if otool -L "$LOCATION" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$LOCATION"
          fi

          ldid -S "$LOCATION"

          PLIST=$(find /tmp/location-work -name "*.plist" | grep -v DEBIAN | head -1)
          if [ -n "$PLIST" ]; then plutil -convert xml1 "$PLIST"; fi

          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/location-work "$DEB"
          echo "=== Location sidecar after patch ==="
          otool -D "$LOCATION"
          otool -L "$LOCATION"

      - name: Build ChangeInfoIosZalo (v2.6.0 sidecar — ultra-thin 12-hook device-info-only spoof for Zalo)
        run: |
          set -euo pipefail
          cd tweak-zalo
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/

          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/zalo-work
          mkdir -p /tmp/zalo-work
          dpkg-deb -R "$DEB" /tmp/zalo-work
          ZALO=$(find /tmp/zalo-work -name "ChangeInfoIosZalo.dylib" | head -1)
          test -n "$ZALO" || { echo "ERR: ChangeInfoIosZalo.dylib missing"; exit 1; }

          install_name_tool -id \
            "/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosZalo.dylib" \
            "$ZALO"

          if otool -L "$ZALO" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$ZALO"
          fi

          ldid -S "$ZALO"

          PLIST=$(find /tmp/zalo-work -name "*.plist" | grep -v DEBIAN | head -1)
          if [ -n "$PLIST" ]; then plutil -convert xml1 "$PLIST"; fi

          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/zalo-work "$DEB"
          echo "=== Zalo sidecar after patch ==="
          otool -D "$ZALO"
          otool -L "$ZALO"

      - name: Build app
        id: build-app
        run: |
          set -o pipefail
          cd app
          rm -rf packages .theos obj
          ls -la
          cat Makefile
          echo "--- main.m first 5 lines ---"
          head -5 main.m
          echo "--- running make ---"
          make package FINALPACKAGE=1 ARCHS=arm64 messages=yes 2>&1 | tee ../app_build.log
          status=${PIPESTATUS[0]}
          echo "make exit: $status"
          ls -la packages/ || true
          exit $status

      - name: Upload app build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log
          path: app_build.log
          if-no-files-found: warn

      - name: Combine into single deb
        run: |
          set -euo pipefail

          TWEAK_DEB=$(ls tweak/packages/*.deb | head -1)
          APP_DEB=$(ls app/packages/*.deb | head -1)
          HELLO_DEB=$(ls helloinject/packages/*.deb | head -1)
          SAFARI_DEB=$(ls tweak-safari/packages/*.deb | head -1)
          LOCATION_DEB=$(ls tweak-location/packages/*.deb | head -1)
          ZALO_DEB=$(ls tweak-zalo/packages/*.deb | head -1)
          echo "Tweak:    $TWEAK_DEB    ($(stat -f%z "$TWEAK_DEB") bytes)"
          echo "App:      $APP_DEB      ($(stat -f%z "$APP_DEB") bytes)"
          echo "Hello:    $HELLO_DEB    ($(stat -f%z "$HELLO_DEB") bytes)"
          echo "Safari:   $SAFARI_DEB   ($(stat -f%z "$SAFARI_DEB") bytes)"
          echo "Location: $LOCATION_DEB ($(stat -f%z "$LOCATION_DEB") bytes)"
          echo "Zalo:     $ZALO_DEB     ($(stat -f%z "$ZALO_DEB") bytes)"

          rm -rf combined /tmp/tweak-extract /tmp/app-extract /tmp/hello-extract /tmp/safari-extract /tmp/location-extract /tmp/zalo-extract
          mkdir -p combined/DEBIAN /tmp/tweak-extract /tmp/app-extract /tmp/hello-extract /tmp/safari-extract /tmp/location-extract /tmp/zalo-extract

          dpkg-deb -x "$TWEAK_DEB"    /tmp/tweak-extract
          dpkg-deb -x "$APP_DEB"      /tmp/app-extract
          dpkg-deb -x "$HELLO_DEB"    /tmp/hello-extract
          dpkg-deb -x "$SAFARI_DEB"   /tmp/safari-extract
          dpkg-deb -x "$LOCATION_DEB" /tmp/location-extract
          dpkg-deb -x "$ZALO_DEB"     /tmp/zalo-extract

          # merge file trees — tweak + app + hello probe + Safari sidecar
          # + Location sidecar + Zalo sidecar all share /var/jb. Each sidecar
          # lands at /var/jb/Library/MobileSubstrate/DynamicLibraries/<name>.{dylib,plist}
          cp -R /tmp/tweak-extract/.    combined/
          cp -R /tmp/app-extract/.      combined/
          cp -R /tmp/hello-extract/.    combined/
          cp -R /tmp/safari-extract/.   combined/
          cp -R /tmp/location-extract/. combined/
          cp -R /tmp/zalo-extract/.     combined/

          # Some rootless loaders (Dopamine ellekit variant) scan
          # /var/jb/usr/lib/TweakInject/ instead of MobileSubstrate/DynamicLibraries/.
          # DO NOT copy payload there at build time — if the dir doesn't exist on
          # the device, dpkg fails the whole install (observed on v2.3.20).
          # Also DO NOT duplicate dylibs: two copies → loader injects twice →
          # each hook runs 2× → lag + possible crash.
          #
          # Strategy: postinst script symlinks dylib+plist into TweakInject/
          # ONLY if that directory already exists. Symlinks (not copies) so
          # the same Mach-O is mmap'd once; no duplicate inject, no extra RAM.
          # prerm removes the symlinks cleanly.
          # Pre-compute cdhashes via ldid -h. The previous inline-JS Mach-O
          # parser computed sha256-truncated hashes that DID NOT match what
          # Apple's runtime trustcache expects — confirmed live on a
          # Dopamine 2 device 2026-05-07: packaged hashes 2a16e6e2... did
          # not match dylib's actual cdhash 92fa0a84... per `ldid -h | grep
          # CDHash`, so jbctl trustcache never matched the real binary,
          # iOS rejected dylib load, and the tweak never injected into
          # any target app. Result: every spoof attempt silently no-op'd.
          #
          # Use ldid (which is already in our build chain via Theos) and
          # parse its `CDHash=...` line. ldid emits one CDHash per
          # FAT slice; pipe through grep to keep all of them.
          mkdir -p combined/var/jb/etc/changeinfoios
          CDHASH_FILE="combined/var/jb/etc/changeinfoios/cdhashes"
          : > "$CDHASH_FILE"
          # Include both dylibs AND the app binary. The app binary's cdhash
          # MUST be in trustcache for restricted entitlements to be honored
          # — com.apple.private.tcc.allow gets stripped by AMFI at launch
          # otherwise. Without this, the Photos picker / Camera / Mic TCC
          # pre-grants in entitlements.plist do nothing.
          for binary in combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIos.dylib \
                       combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosSafari.dylib \
                       combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosLocation.dylib \
                       combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosZalo.dylib \
                       combined/var/jb/Library/MobileSubstrate/DynamicLibraries/HelloInject.dylib \
                       combined/var/jb/Applications/ChangeInfoIosApp.app/ChangeInfoIosApp; do
            [ -f "$binary" ] || continue
            ldid -h "$binary" 2>/dev/null | awk -F= '/^CDHash=/ {print $2}' >> "$CDHASH_FILE"
          done
          echo "=== cdhashes packaged in deb (extracted via ldid -h) ==="
          cat "$CDHASH_FILE"

          cat > combined/DEBIAN/postinst <<'POSTINST'
          #!/bin/sh
          # Universal postinst — runs on Dopamine 2, Dopamine 1, palera1n
          # rootless, and rootful jailbreaks. Every step is best-effort and
          # falls back gracefully if the relevant tool isn't present.
          #
          # Responsibilities:
          # (1) Detect rootless prefix — /var/jb on Dopamine 2 / palera1n
          #     rootless, "/" on rootful jailbreaks.
          # (2) chown dylib + plist to root:wheel, 0644/0755 perms — matches
          #     what AppSyncUnified ships and what ellekit's boot-time
          #     trustcache loader expects (we observed mobile:staff silently
          #     skipping inject on Dopamine 2).
          # (3) chmod 0777 the shared config dir so the host app (running as
          #     mobile) can drop config.plist where sandboxed tweaks can
          #     read it (verified: App Store app sandboxes block
          #     /var/mobile/Library/Preferences but allow /var/jb/etc/*).
          # (4) Add every cdhash from the packaged list to the runtime
          #     trustcache via `jbctl trustcache add <cdhash>` if jbctl
          #     exists (Dopamine 2 only). Other jailbreaks auto-trust dylibs
          #     under TweakInject/MobileSubstrate at boot, so this is a no-op
          #     on those.
          # (5) Refresh icon cache so the app shows up after install.
          set -e

          # Detect rootless prefix
          if [ -d /var/jb ]; then
            ROOT=/var/jb
          else
            ROOT=
          fi
          MS="$ROOT/Library/MobileSubstrate/DynamicLibraries"
          ETC="$ROOT/etc/changeinfoios"
          # Locate jbctl across known paths.
          JBCTL=""
          for c in "$ROOT/basebin/jbctl" "/var/jb/basebin/jbctl" "$ROOT/usr/bin/jbctl"; do
            [ -x "$c" ] && JBCTL="$c" && break
          done

          # (2) Ownership / mode for the tweak payload.
          for f in "$MS/ChangeInfoIos.dylib"          "$MS/ChangeInfoIos.plist" \
                   "$MS/ChangeInfoIosSafari.dylib"    "$MS/ChangeInfoIosSafari.plist" \
                   "$MS/ChangeInfoIosLocation.dylib"  "$MS/ChangeInfoIosLocation.plist" \
                   "$MS/ChangeInfoIosZalo.dylib"      "$MS/ChangeInfoIosZalo.plist" \
                   "$MS/HelloInject.dylib"            "$MS/HelloInject.plist"; do
            [ -e "$f" ] || continue
            chown root:wheel "$f" 2>/dev/null || true
            case "$f" in
              *.dylib) chmod 0755 "$f" 2>/dev/null || true ;;
              *)       chmod 0644 "$f" 2>/dev/null || true ;;
            esac
          done

          # (3) Shared config dir world-writable.
          mkdir -p "$ETC" 2>/dev/null || true
          chmod 0777 "$ETC" 2>/dev/null || true

          # (4) Trustcache — feed the embedded cdhash list, one hash per
          # line. Skips silently if jbctl isn't on this jailbreak.
          if [ -n "$JBCTL" ] && [ -f "$ETC/cdhashes" ]; then
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              "$JBCTL" trustcache add "$h" 2>/dev/null || true
            done < "$ETC/cdhashes"
          fi

          # (5) Refresh icon cache for the GUI app. Run uicache via every
          # rootless / rootful path we know about — only one needs to land.
          APP="$ROOT/Applications/ChangeInfoIosApp.app"
          for u in uicache "$ROOT/usr/bin/uicache" /var/jb/usr/bin/uicache /usr/bin/uicache; do
            command -v "$u" >/dev/null 2>&1 && "$u" -p "$APP" 2>/dev/null && break
          done

          exit 0
          POSTINST
          chmod 0755 combined/DEBIAN/postinst



          VERSION=$(grep '^Version:' tweak/control | awk '{print $2}')
          cat > combined/DEBIAN/control <<EOF
          Package: com.changeinfoios
          Name: ChangeInfoIos
          Version: ${VERSION}
          Architecture: iphoneos-arm64
          Description: Device spoofer for iOS 15-16.7 (tweak + native UI app).
          Maintainer: ChangeInfoIos
          Author: ChangeInfoIos
          Section: Tweaks
          Depends: ellekit | mobilesubstrate, firmware (>= 15.0)
          Recommends: ai.akemi.appsyncunified
          Replaces: com.changeinfoios.tweak, com.changeinfoios.app, com.changeinfoios.bundle
          Conflicts: com.changeinfoios.tweak, com.changeinfoios.app, com.changeinfoios.bundle
          Provides: com.changeinfoios.tweak, com.changeinfoios.app
          EOF

          mkdir -p out
          dpkg-deb -Zxz -b combined "out/ChangeInfoIos_${VERSION}_iphoneos-arm64.deb"
          ls -lh out/

      - name: Audit combined deb layout (rootless path verification)
        run: |
          set -euo pipefail
          # Rootless jailbreaks (Dopamine 2, palera1n rootless) expect:
          #   /var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib
          #   /var/jb/Library/MobileSubstrate/DynamicLibraries/*.plist
          #   /var/jb/Applications/*.app  (GUI apps)
          # If any payload lands elsewhere, ellekit/substrate never sees it
          # and inject silently fails. This step prints the full tree + key
          # attributes so we can diagnose missing/misplaced files from CI logs.
          echo "=== combined/ tree ==="
          find combined -type f -o -type l | sort
          echo
          echo "=== /var/jb path check ==="
          test -d combined/var/jb || { echo "ERR: combined/var/jb missing — rootless prefix not applied"; exit 1; }
          echo "OK: combined/var/jb exists"
          echo
          echo "=== substrate dylibs in payload ==="
          find combined -path '*MobileSubstrate/DynamicLibraries*' -type f | while read f; do
            echo "--- $f ---"
            ls -l "$f"
            case "$f" in
              *.dylib)
                echo "  install_name: $(otool -D "$f" | tail -1)"
                echo "  arch:         $(lipo -info "$f" 2>/dev/null | sed 's/.*://')"
                echo "  entitlements (ldid -e, head 5):"
                ldid -e "$f" 2>/dev/null | head -5 | sed 's/^/    /'
                ;;
              *.plist)
                echo "  plist contents:"
                plutil -p "$f" | sed 's/^/    /'
                ;;
            esac
          done
          echo
          echo "=== GUI app bundles in payload ==="
          find combined -name 'Info.plist' -path '*.app/*' | while read f; do
            echo "--- $f ---"
            plutil -p "$f" | grep -E 'CFBundleIdentifier|CFBundleExecutable|CFBundleShortVersionString' | sed 's/^/    /'
          done
          echo
          echo "=== DEBIAN/control ==="
          cat combined/DEBIAN/control

      - name: Show sizes
        if: always()
        run: |
          echo "=== All .deb files ==="
          find . -name "*.deb" -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload combined deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-combined
          path: out/*.deb
          retention-days: 14

      - name: Upload tweak deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-only
          path: tweak/packages/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload app deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-only
          path: app/packages/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Build Sileo repo (Packages.xz + Release)
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          cp out/*.deb repo/debs/
          cd repo
          # Packages index — Sileo reads this to list available packages.
          dpkg-scanpackages -m debs > Packages
          xz -k9e Packages
          gzip -k9 Packages
          VERSION=$(grep '^Version:' ../tweak/control | awk '{print $2}')
          # Release file — Sileo source metadata.
          cat > Release <<EOF
          Origin: HIOS Faker
          Label: HIOS Faker
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: ChangeInfoIos device spoofer (tweak + UI app)
          EOF
          # CydiaIcon for source-list display (reuse app icon if present)
          if [ -f ../icon.png ]; then cp ../icon.png CydiaIcon.png; fi
          ls -la

      - name: Publish Sileo repo to GitHub Pages
        if: success() && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
          commit_message: "deploy repo for ${{ github.sha }}"

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^Version:' tweak/control | awk '{print $2}')
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          gh release create "$TAG" out/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "HIOS Faker ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Automated build from commit ${GITHUB_SHA}.

          Install via Sileo: add source \`https://hieudeptrai04.github.io/HIOS-Faker/\` then search **HIOS Faker**. Sileo will pull AppSync Unified automatically (requires \`https://cydia.akemi.ai/\` source). Reboot/respring after install.

          Or download the .deb below and open with Sileo." \
            || echo "release for $TAG may already exist — skipping"

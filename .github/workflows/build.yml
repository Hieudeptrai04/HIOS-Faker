name: Build ChangeInfoIos

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "tweak/**"
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: rootless
      SDK_VERSION: "16.5"
      SDK_RELEASE: "master-146e41f"
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      - name: Cache Theos + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-v4-sdk${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE }}

      - name: Install Theos + SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Verify Theos
        run: |
          set -euo pipefail
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/sdks/"

      - name: Build tweak
        run: |
          set -euo pipefail
          cd tweak
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -lh packages/
          test -n "$(ls packages/*.deb 2>/dev/null)"

      - name: Patch CydiaSubstrate → libsubstrate.dylib (rootless compat)
        run: |
          set -euo pipefail
          cd tweak
          # Theos mặc định link dylib với @rpath/CydiaSubstrate.framework/CydiaSubstrate.
          # Trên rootless jb với ellekit thuần (không có CS-compat symlink), dyld
          # fail resolve @rpath → substrate silently skip inject.
          # Fix: extract .deb, patch dylib với install_name_tool sang path tuyệt đối
          # /var/jb/usr/lib/libsubstrate.dylib (ellekit cung cấp), ldid -S, repack .deb.
          DEB=$(ls packages/*.deb | head -1)
          echo "Original .deb: $DEB"

          rm -rf /tmp/deb-work
          mkdir -p /tmp/deb-work
          # -R preserves DEBIAN/ control directory alongside payload
          dpkg-deb -R "$DEB" /tmp/deb-work

          DEPLOYED=$(find /tmp/deb-work -name "ChangeInfoIos.dylib" | head -1)
          test -n "$DEPLOYED" || { echo "ERR: no dylib in .deb"; exit 1; }

          echo "=== before patch ==="
          otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit' || true

          if otool -L "$DEPLOYED" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              "@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
              "/var/jb/usr/lib/libsubstrate.dylib" \
              "$DEPLOYED"
            ldid -S "$DEPLOYED"
            echo "=== after patch ==="
            otool -L "$DEPLOYED" | grep -iE 'substrate|ellekit'
          else
            echo "No CydiaSubstrate.framework reference found — already correct"
          fi

          # Repack .deb in-place (dpkg-deb -b reads DEBIAN/ from the unpacked dir)
          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/deb-work "$DEB"
          ls -lh packages/

      - name: Verify tweak dylib (from patched .deb)
        run: |
          set -euo pipefail
          cd tweak
          # Verify từ .deb cuối cùng (sau patch), không phải .theos/obj gốc
          rm -rf /tmp/tweak-verify
          dpkg-deb -x packages/*.deb /tmp/tweak-verify
          DYLIB=$(find /tmp/tweak-verify -name "ChangeInfoIos.dylib" | head -1)
          test -n "$DYLIB" || { echo "ERR: no dylib in .deb"; exit 1; }
          echo "=== arch slices ==="
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -qE 'arm64.*arm64e|arm64e.*arm64' || { echo "ERR: missing arm64e"; exit 1; }
          echo "=== codesign ==="
          ldid -e "$DYLIB" | head -20 || true
          codesign -dv "$DYLIB" 2>&1 | head -5 || true
          echo "=== linked frameworks ==="
          otool -L "$DYLIB"
          echo "=== substrate link check ==="
          if otool -L "$DYLIB" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            echo "ERR: CydiaSubstrate.framework still referenced — patch failed!"
            exit 1
          fi
          otool -L "$DYLIB" | grep -iE 'substrate|ellekit' || { echo "ERR: no substrate link at all"; exit 1; }
          echo "=== undefined symbols ==="
          nm -u "$DYLIB" 2>/dev/null | head -20 || true
          echo "=== filter plist ==="
          FILTER=$(find /tmp/tweak-verify -name "ChangeInfoIos.plist" | head -1)
          test -n "$FILTER" || { echo "ERR: filter plist missing"; exit 1; }
          plutil -lint "$FILTER"
          echo "Filter plist OK: $FILTER"

      - name: Build app
        id: build-app
        run: |
          set -o pipefail
          cd app
          rm -rf packages .theos obj
          ls -la
          cat Makefile
          echo "--- main.m first 5 lines ---"
          head -5 main.m
          echo "--- running make ---"
          make package FINALPACKAGE=1 ARCHS=arm64 messages=yes 2>&1 | tee ../app_build.log
          status=${PIPESTATUS[0]}
          echo "make exit: $status"
          ls -la packages/ || true
          exit $status

      - name: Upload app build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log
          path: app_build.log
          if-no-files-found: warn

      - name: Combine into single deb
        run: |
          set -euo pipefail

          TWEAK_DEB=$(ls tweak/packages/*.deb | head -1)
          APP_DEB=$(ls app/packages/*.deb | head -1)
          echo "Tweak: $TWEAK_DEB ($(stat -f%z "$TWEAK_DEB") bytes)"
          echo "App:   $APP_DEB ($(stat -f%z "$APP_DEB") bytes)"

          rm -rf combined /tmp/tweak-extract /tmp/app-extract
          mkdir -p combined/DEBIAN /tmp/tweak-extract /tmp/app-extract

          dpkg-deb -x "$TWEAK_DEB" /tmp/tweak-extract
          dpkg-deb -x "$APP_DEB"   /tmp/app-extract

          # merge file trees (tweak dylib + app bundle share /var/jb root)
          cp -R /tmp/tweak-extract/. combined/
          cp -R /tmp/app-extract/.   combined/

          VERSION=$(grep '^Version:' tweak/control | awk '{print $2}')
          cat > combined/DEBIAN/control <<EOF
          Package: com.changeinfoios
          Name: ChangeInfoIos
          Version: ${VERSION}
          Architecture: iphoneos-arm64
          Description: Device spoofer for iOS 15-16.7 (tweak + native UI app).
          Maintainer: ChangeInfoIos
          Author: ChangeInfoIos
          Section: Tweaks
          Depends: ellekit | mobilesubstrate, firmware (>= 15.0)
          Replaces: com.changeinfoios.tweak, com.changeinfoios.app, com.changeinfoios.bundle
          Conflicts: com.changeinfoios.tweak, com.changeinfoios.app, com.changeinfoios.bundle
          Provides: com.changeinfoios.tweak, com.changeinfoios.app
          EOF

          mkdir -p out
          dpkg-deb -Zxz -b combined "out/ChangeInfoIos_${VERSION}_iphoneos-arm64.deb"
          ls -lh out/

      - name: Show sizes
        if: always()
        run: |
          echo "=== All .deb files ==="
          find . -name "*.deb" -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload combined deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-combined
          path: out/*.deb
          retention-days: 14

      - name: Upload tweak deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-only
          path: tweak/packages/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload app deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-only
          path: app/packages/*.deb
          retention-days: 7
          if-no-files-found: warn

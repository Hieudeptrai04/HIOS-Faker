name: Build iOS Tweak (macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Theos
        run: |
          THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download SDK
        run: |
          THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"

      - name: Build tweak
        run: |
          THEOS="$HOME/theos"
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee tweak_build.log
          echo "TWEAK_EXIT: ${PIPESTATUS[0]}"
          ls -la packages/ 2>/dev/null || echo "NO_PACKAGES"

      - name: Build app
        run: |
          THEOS="$HOME/theos"
          cd app
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee app_build.log
          echo "APP_EXIT: ${PIPESTATUS[0]}"
          ls -la packages/ 2>/dev/null || echo "NO_PACKAGES"

      - name: Check result
        if: always()
        run: |
          echo "=== Tweak build log tail ==="
          tail -30 tweak/tweak_build.log 2>/dev/null || echo "No tweak log"
          echo "=== App build log tail ==="
          tail -30 app/app_build.log 2>/dev/null || echo "No app log"
          echo "=== All debs ==="
          find . -name "*.deb" -type f

      - name: Upload tweak deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: tweak/packages/*.deb
          retention-days: 1

      - name: Upload app deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-deb
          path: app/packages/*.deb
          retention-days: 1

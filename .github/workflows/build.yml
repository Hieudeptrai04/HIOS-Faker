name: Build ChangeInfoIos v3

on:
  workflow_dispatch:
  push:
    branches:
      - v3
    paths:
      - "tweak-mg/**"
      - "tweak-ct/**"
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: rootless
      SDK_VERSION: "16.5"
      SDK_RELEASE: "master-146e41f"
    steps:
      - uses: actions/checkout@v4

      - name: Init build log
        run: |
          mkdir -p /tmp
          : > /tmp/build.log
          echo "=== build log init $(date) sha=${GITHUB_SHA} ===" > /tmp/build.log

      - name: Install ldid + dpkg
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo ">>> STEP: Install ldid + dpkg <<<"
          brew install ldid dpkg

      - name: Cache Theos + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-v3-sdk${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE }}

      - name: Install Theos + SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo ">>> STEP: Install Theos + SDK <<<"
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      # =================================================================
      # Reusable helper: build a tweak dir + patch install_name + sign
      # =================================================================
      - name: Build + patch tweak-mg
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo ">>> STEP: Build + patch tweak-mg <<<"
          set -euo pipefail
          DEPLOY_DIR="/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cd tweak-mg
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/mg-work
          mkdir -p /tmp/mg-work
          dpkg-deb -R "$DEB" /tmp/mg-work
          DYLIB=$(find /tmp/mg-work -name "ChangeInfoIosMG.dylib" | head -1)
          test -n "$DYLIB" || { echo "ERR: no MG dylib"; exit 1; }
          install_name_tool -id "$DEPLOY_DIR/ChangeInfoIosMG.dylib" "$DYLIB"
          if otool -L "$DYLIB" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "/var/jb/usr/lib/libsubstrate.dylib" "$DYLIB"
          fi
          ldid -S "$DYLIB"
          # Convert plist filter to XML format (ellekit-friendly)
          PLIST=$(find /tmp/mg-work -name "*.plist" | grep -v DEBIAN | head -1)
          [ -n "$PLIST" ] && plutil -convert xml1 "$PLIST"
          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/mg-work "$DEB"
          echo "=== tweak-mg ==="
          otool -D "$DYLIB"
          otool -L "$DYLIB"

      - name: Build + patch tweak-ct
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo ">>> STEP: Build + patch tweak-ct <<<"
          set -euo pipefail
          DEPLOY_DIR="/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cd tweak-ct
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          DEB=$(ls packages/*.deb | head -1)
          rm -rf /tmp/ct-work
          mkdir -p /tmp/ct-work
          dpkg-deb -R "$DEB" /tmp/ct-work
          DYLIB=$(find /tmp/ct-work -name "ChangeInfoIosCT.dylib" | head -1)
          test -n "$DYLIB" || { echo "ERR: no CT dylib"; exit 1; }
          install_name_tool -id "$DEPLOY_DIR/ChangeInfoIosCT.dylib" "$DYLIB"
          if otool -L "$DYLIB" | grep -q "CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "/var/jb/usr/lib/libsubstrate.dylib" "$DYLIB"
          fi
          ldid -S "$DYLIB"
          PLIST=$(find /tmp/ct-work -name "*.plist" | grep -v DEBIAN | head -1)
          [ -n "$PLIST" ] && plutil -convert xml1 "$PLIST"
          rm -f "$DEB"
          dpkg-deb -Zxz -b /tmp/ct-work "$DEB"

      - name: Build host app
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo ">>> STEP: Build host app <<<"
          set -euo pipefail
          cd app
          rm -rf packages .theos obj
          make package FINALPACKAGE=1 ARCHS=arm64
          ls -lh packages/

      - name: Combine into single deb
        run: |
          set -euo pipefail
          MG=$(ls tweak-mg/packages/*.deb | head -1)
          CT=$(ls tweak-ct/packages/*.deb | head -1)
          APP=$(ls app/packages/*.deb | head -1)
          echo "MG:  $MG"
          echo "CT:  $CT"
          echo "App: $APP"

          rm -rf combined /tmp/mg-x /tmp/ct-x /tmp/app-x
          mkdir -p combined/DEBIAN /tmp/mg-x /tmp/ct-x /tmp/app-x
          dpkg-deb -x "$MG"  /tmp/mg-x
          dpkg-deb -x "$CT"  /tmp/ct-x
          dpkg-deb -x "$APP" /tmp/app-x
          cp -R /tmp/mg-x/.  combined/
          cp -R /tmp/ct-x/.  combined/
          cp -R /tmp/app-x/. combined/

          # cdhash collection for trustcache
          mkdir -p combined/var/jb/etc/changeinfoios
          CDHASH=combined/var/jb/etc/changeinfoios/cdhashes
          : > "$CDHASH"
          for f in \
              combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosMG.dylib \
              combined/var/jb/Library/MobileSubstrate/DynamicLibraries/ChangeInfoIosCT.dylib \
              combined/var/jb/Applications/HIOSFakerV3.app/HIOSFakerV3; do
            [ -f "$f" ] || continue
            ldid -h "$f" 2>/dev/null | awk -F= '/^CDHash=/ {print $2}' >> "$CDHASH"
          done
          cat "$CDHASH"

          # postinst — chown + trustcache + uicache
          cat > combined/DEBIAN/postinst <<'POSTINST'
          #!/bin/sh
          set -e
          ROOT=/var/jb
          MS="$ROOT/Library/MobileSubstrate/DynamicLibraries"
          ETC="$ROOT/etc/changeinfoios"
          JBCTL=""
          for c in "$ROOT/basebin/jbctl" "/var/jb/basebin/jbctl" "$ROOT/usr/bin/jbctl"; do
            [ -x "$c" ] && JBCTL="$c" && break
          done

          for f in "$MS/ChangeInfoIosMG.dylib" "$MS/ChangeInfoIosMG.plist" \
                   "$MS/ChangeInfoIosCT.dylib" "$MS/ChangeInfoIosCT.plist"; do
            [ -e "$f" ] || continue
            chown root:wheel "$f" 2>/dev/null || true
            case "$f" in
              *.dylib) chmod 0755 "$f" 2>/dev/null || true ;;
              *)       chmod 0644 "$f" 2>/dev/null || true ;;
            esac
          done

          mkdir -p "$ETC" 2>/dev/null || true
          chmod 0777 "$ETC" 2>/dev/null || true

          if [ -n "$JBCTL" ] && [ -f "$ETC/cdhashes" ]; then
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              "$JBCTL" trustcache add "$h" 2>/dev/null || true
            done < "$ETC/cdhashes"
          fi

          APP="$ROOT/Applications/HIOSFakerV3.app"
          for u in uicache "$ROOT/usr/bin/uicache" /var/jb/usr/bin/uicache /usr/bin/uicache; do
            command -v "$u" >/dev/null 2>&1 && "$u" -p "$APP" 2>/dev/null && break
          done

          exit 0
          POSTINST
          chmod 0755 combined/DEBIAN/postinst

          VERSION=$(grep '^Version:' tweak-mg/control | awk '{print $2}')
          cat > combined/DEBIAN/control <<EOF
          Package: com.changeinfoios.v3
          Name: HIOS Faker v3
          Version: ${VERSION}
          Architecture: iphoneos-arm64
          Description: ChangeInfoIos v3 — focused device-spoof for popular iOS apps. Zero injection into target apps; central spoof in MobileGestaltHelper + CoreTelephony daemons.
          Maintainer: ChangeInfoIos
          Author: ChangeInfoIos
          Section: Tweaks
          Depends: ellekit | mobilesubstrate, firmware (>= 15.0)
          Replaces: com.changeinfoios.tweak, com.changeinfoios.app, com.changeinfoios, com.changeinfoios.bundle, com.changeinfoios.safari, com.changeinfoios.location, com.changeinfoios.zalo
          Conflicts: com.changeinfoios.tweak, com.changeinfoios.bundle
          Provides: com.changeinfoios.tweak
          EOF

          mkdir -p out
          dpkg-deb -Zxz -b combined "out/ChangeInfoIos-v3_${VERSION}_iphoneos-arm64.deb"
          ls -lh out/

      - name: Show payload tree
        run: find combined -type f -o -type l | sort

      - name: Upload combined deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-v3-combined
          path: out/*.deb
          retention-days: 14

      # Deploy APT repo to gh-pages under /v3/ subdirectory.
      # v2 repo lives at root of gh-pages; v3 lives at /v3/ — no conflict.
      - name: Deploy Sileo repo to gh-pages /v3/
        if: success() && github.ref == 'refs/heads/v3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEB=$(ls out/*.deb | head -1)
          DEBNAME=$(basename "$DEB")
          VERSION=$(grep '^Version:' tweak-mg/control | awk '{print $2}')
          SIZE=$(stat -f%z "$DEB" 2>/dev/null || stat -c%s "$DEB")
          MD5=$(md5 -q "$DEB"   2>/dev/null || md5sum "$DEB" | cut -d' ' -f1)
          SHA1=$(shasum -a 1 "$DEB"   | cut -d' ' -f1)
          SHA256=$(shasum -a 256 "$DEB" | cut -d' ' -f1)

          # Build APT repo structure in a temp dir
          mkdir -p /tmp/v3repo/pool/main
          cp "$DEB" "/tmp/v3repo/pool/main/$DEBNAME"

          cat > /tmp/v3repo/Packages << PKGEOF
Package: com.changeinfoios.v3
Name: HIOS Faker v3
Version: ${VERSION}
Architecture: iphoneos-arm64
Section: Tweaks
Author: ChangeInfoIos
Maintainer: ChangeInfoIos
Depends: ellekit | mobilesubstrate, firmware (>= 15.0)
Description: HIOS Faker v3 — 22-layer device spoof for Zalo/FB/TikTok/IG/Shopee. Zero injection into target apps.
Filename: pool/main/${DEBNAME}
Size: ${SIZE}
MD5sum: ${MD5}
SHA1: ${SHA1}
SHA256: ${SHA256}

PKGEOF
          bzip2 -k /tmp/v3repo/Packages
          gzip  -k /tmp/v3repo/Packages

          cat > /tmp/v3repo/Release << RELEOF
Origin: HIOS Faker
Label: HIOS Faker v3
Suite: stable
Version: ${VERSION}
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: HIOS Faker v3 - Deep device spoof tweak
RELEOF

          # Push to gh-pages/v3/ without touching v2 root
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          rm -rf v3
          mv /tmp/v3repo v3
          git add v3/
          git diff --cached --quiet || git commit -m "repo: v3 ${VERSION} (${GITHUB_SHA::7})"
          git push origin gh-pages

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/v3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^Version:' tweak-mg/control | awk '{print $2}')
          TAG="v3-${VERSION}-${GITHUB_SHA::7}"
          gh release create "$TAG" out/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "HIOS Faker v3 ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Automated v3 build from ${GITHUB_SHA}. Zero-injection device spoof. Install via Sileo or download below."

      # Auto-upload the in-step-captured /tmp/build.log on failure.
      # Each build step prepends `exec > >(tee -a /tmp/build.log) 2>&1`
      # so all stdout/stderr lands in that file. We upload it as a
      # PUBLIC GitHub Release asset — anonymous curl can fetch.
      - name: On failure — publish captured build.log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ls -la /tmp/build.log 2>&1
          echo "===== TAIL OF /tmp/build.log ====="
          tail -200 /tmp/build.log
          echo "===== END TAIL ====="
          [ -s /tmp/build.log ] || echo "(empty)" > /tmp/build.log
          TAG="debug-fail-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          gh release create "$TAG" /tmp/build.log \
            --repo "$GITHUB_REPOSITORY" \
            --title "DEBUG fail ${GITHUB_SHA::7} run=${GITHUB_RUN_ID}" \
            --notes "Auto-uploaded failure log. SHA=${GITHUB_SHA}" \
            --prerelease || true
          echo "DEBUG_RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

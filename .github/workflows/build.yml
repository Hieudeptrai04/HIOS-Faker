name: Build iOS Tweak (macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "Setup complete: THEOS=$THEOS"

      - name: Build tweak
        run: |
          echo "Using THEOS=$THEOS"
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1
          echo "TWEAK_EXIT: $?"

      - name: Build app
        run: |
          echo "Using THEOS=$THEOS"
          cd app
          rm -rf packages/ .theos/ obj/
          make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1
          echo "APP_EXIT: $?"

      - name: Check result
        if: always()
        run: |
          echo "=== Tweak packages ==="
          find . -path "*/tweak/packages/*.deb" -type f
          echo "=== App packages ==="
          find . -path "*/app/packages/*.deb" -type f

      - name: Upload tweak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: tweak/packages/*.deb
          retention-days: 1

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-deb
          path: app/packages/*.deb
          retention-days: 1

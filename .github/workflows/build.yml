name: Build iOS Tweak (macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/
          echo "SDK OK"

      - name: Build tweak
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee tweak_build.log
          echo "TWEAK_EXIT: $?"

      - name: Build app
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd ../app
          rm -rf packages/ .theos/ obj/
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee app_build.log
          echo "APP_EXIT: $?"

      - name: Check result
        if: always()
        run: |
          echo "=== Tweak build log ==="
          cat tweak/tweak_build.log 2>/dev/null || echo "No tweak log"
          echo "=== App build log ==="
          cat app/app_build.log 2>/dev/null || echo "No app log"
          echo "=== All debs ==="
          find . -name "*.deb" -type f

      - name: Upload tweak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: tweak/packages/*.deb

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-deb
          path: app/packages/*.deb

# Build .deb on Ubuntu with manual Theos + iOS SDK install
# (beerpiss/theos-action@v1 is broken: downloads non-xz file and tar fails)

name: Build DEB

on:
  workflow_dispatch:
  push:
    paths:
      - "tweak/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_URL: https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            perl fakeroot build-essential cmake curl xz-utils \
            libplist-dev libssl-dev zlib1g-dev git dpkg-dev

      - name: Install ldid (from ProcursusTeam)
        run: |
          set -e
          cd /tmp
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git
          cd ldid
          make -j"$(nproc)"
          sudo install -m 0755 ldid /usr/local/bin/ldid
          ldid -V || ldid -v || true

      - name: Clone Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          ls -la "$THEOS/bin/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Download iOS SDK 16.5
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          curl -fSL "$SDK_URL" -o /tmp/sdk.tar.xz
          echo "Downloaded size: $(stat -c%s /tmp/sdk.tar.xz) bytes"
          file /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          rm -f /tmp/sdk.tar.xz
          ls -la "$THEOS/sdks/"

      - name: Inspect Theos vendor libs
        run: |
          echo "=== vendor/lib contents ==="
          ls -la "$THEOS/vendor/lib/" || true
          echo "=== vendor/include/substrate ==="
          ls "$THEOS/vendor/include/" 2>/dev/null | grep -i substrate || true

      - name: Build rootless package
        env:
          THEOS_PACKAGE_SCHEME: rootless
          THEOS_DEVICE_ARCH: arm64
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}/tweak"
          rm -rf packages/ .theos/ obj/ || true
          echo "=== make package start ==="
          make package FINALPACKAGE=1 2>&1 | tee "${GITHUB_WORKSPACE}/make_output.txt"
          MAKE_STATUS=${PIPESTATUS[0]}
          echo "=== make exit status: $MAKE_STATUS ==="
          if [ "$MAKE_STATUS" -ne 0 ]; then
            echo "make package failed"
            exit "$MAKE_STATUS"
          fi
          echo "=== Scanning for .deb anywhere in workspace ==="
          find "${GITHUB_WORKSPACE}" -name "*.deb" -type f -exec ls -lh {} \; || true
          echo "=== tweak/packages contents ==="
          ls -la packages/ 2>/dev/null || echo "(no packages dir)"
          echo "=== tweak/.theos contents ==="
          ls -la .theos/ 2>/dev/null || echo "(no .theos dir)"

      - name: Upload make output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-output-deb
          path: make_output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Copy .deb to packages/
        run: |
          set -e
          mkdir -p "${GITHUB_WORKSPACE}/packages"
          # Scan the whole workspace — rootless / arm64e / FINALPACKAGE may
          # place the .deb under tweak/packages, .theos/_/, or elsewhere.
          mapfile -t DEBS < <(find "${GITHUB_WORKSPACE}" -name "*.deb" -type f)
          if [ "${#DEBS[@]}" -eq 0 ]; then
            echo "ERROR: no .deb produced anywhere in workspace"
            echo "Full make_output.txt tail:"
            tail -80 "${GITHUB_WORKSPACE}/make_output.txt" || true
            exit 1
          fi
          for f in "${DEBS[@]}"; do
            cp -v "$f" "${GITHUB_WORKSPACE}/packages/"
          done
          ls -la "${GITHUB_WORKSPACE}/packages/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-deb
          path: packages/*.deb
          retention-days: 30

# Build tweak + app on Ubuntu with Theos

name: Build DEB

on:
  workflow_dispatch:
  push:
    paths:
      - "tweak/**"
      - "app/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            perl fakeroot build-essential cmake curl xz-utils \
            libplist-dev libssl-dev zlib1g-dev git dpkg-dev

      - name: Install ldid
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git
          cd ldid && make -j"$(nproc)"
          sudo install -m 0755 ldid /usr/local/bin/ldid

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install toolchain
        run: |
          mkdir -p $THEOS/toolchain
          curl -fSL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C $THEOS/toolchain/

      - name: Download SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -fSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks/

      - name: Build tweak
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          rm -rf packages/ .theos/ obj/
          make package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee $GITHUB_WORKSPACE/tweak-output.txt
          echo "Exit: $?"

      - name: Build app
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd app
          rm -rf packages/ .theos/ obj/
          make package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee $GITHUB_WORKSPACE/app-output.txt
          echo "Exit: $?"

      - name: Inspect outputs
        run: |
          echo "=== tweak output ==="
          tail -30 $GITHUB_WORKSPACE/tweak-output.txt
          echo ""
          echo "=== app output ==="
          tail -30 $GITHUB_WORKSPACE/app-output.txt
          echo ""
          echo "=== Files created ==="
          find $GITHUB_WORKSPACE -name "*.deb" -type f
          find $GITHUB_WORKSPACE -name "*.dylib" -type f
          find $GITHUB_WORKSPACE -path "*/.theos/_/*" -type f

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/tweak-output.txt
            ${{ github.workspace }}/app-output.txt
          retention-days: 7

      - name: Combine packages
        run: |
          mkdir -p $GITHUB_WORKSPACE/out/DEBIAN
          mkdir -p $GITHUB_WORKSPACE/out/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p $GITHUB_WORKSPACE/out/var/jb/Applications/ChangeInfoIosApp.app

          # Extract tweak
          TWEAK=$(find $GITHUB_WORKSPACE/tweak -name "*.deb" -type f | head -1)
          echo "Tweak deb: $TWEAK"
          if [ -n "$TWEAK" ]; then
            dpkg-deb -x "$TWEAK" /tmp/tweak-extract
            ls -la /tmp/tweak-extract/
            cp -r /tmp/tweak-extract/var/jb/Library/MobileSubstrate/DynamicLibraries/* $GITHUB_WORKSPACE/out/var/jb/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || true
          fi

          # Extract app
          APP=$(find $GITHUB_WORKSPACE/app -name "*.deb" -type f | head -1)
          echo "App deb: $APP"
          if [ -n "$APP" ]; then
            dpkg-deb -x "$APP" /tmp/app-extract
            ls -la /tmp/app-extract/
            cp -r /tmp/app-extract/var/jb/Applications/* $GITHUB_WORKSPACE/out/var/jb/Applications/ 2>/dev/null || true
            cp -r /tmp/app-extract/Applications/* $GITHUB_WORKSPACE/out/var/jb/Applications/ 2>/dev/null || true
          fi

          echo "=== Combined contents ==="
          find $GITHUB_WORKSPACE/out -type f

      - name: Create final deb
        run: |
          cat > $GITHUB_WORKSPACE/out/DEBIAN/control << 'EOF'
Package: com.changeinfoios.tweak
Name: ChangeInfoIos
Version: 2.2.1-native
Architecture: iphoneos-arm64
Description: Device spoofer for iOS 15-16.7. Native UI + 92 hooks.
Maintainer: ChangeInfoIos
Section: Tweaks
Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0)
EOF

          chmod 755 $GITHUB_WORKSPACE/out/DEBIAN/control
          mkdir -p $GITHUB_WORKSPACE/packages

          echo "=== Building deb ==="
          fakeroot dpkg-deb -b $GITHUB_WORKSPACE/out $GITHUB_WORKSPACE/packages/ChangeInfoIos.deb

          SIZE=$(stat -c%s $GITHUB_WORKSPACE/packages/ChangeInfoIos.deb)
          echo "Final size: $SIZE bytes"
          ls -lh $GITHUB_WORKSPACE/packages/

          if [ $SIZE -lt 50000 ]; then
            echo "WARNING: Deb is small ($SIZE bytes)"
            find $GITHUB_WORKSPACE/out -type f -exec ls -lh {} \;
          fi

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ChangeInfoIos-v2.2.1
          path: packages/ChangeInfoIos.deb
          retention-days: 30

name: Build iOS Tweak (Ubuntu)

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld zip wget curl file

      - name: Install ldid
        run: |
          wget -q https://github.com/sbingner/llvm-project/releases/download/v10.0.0/ldid
          chmod +x ldid
          sudo mv ldid /usr/local/bin/ldid

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos

      - name: Generate iOS SDK (minimal)
        run: |
          THEOS="$HOME/theos"
          SDK="$THEOS/sdks/iPhoneOS15.0.sdk"
          mkdir -p "$SDK/System/Library/Frameworks"
          mkdir -p "$SDK/usr/include/objc"

          # Create minimal Foundation.h
          cat > "$SDK/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h" << 'FOUND'
#ifndef _FOUNDATION_H
#define _FOUNDATION_H
#include <stdint.h>
#include <stddef.h>
#include <stdlib.h>
typedef void * id;
typedef struct objc_class *Class;
typedef struct objc_selector *SEL;
typedef long NSInteger;
typedef unsigned long NSUInteger;
typedef int BOOL;
#define YES 1
#define NO 0
#define nil ((id)0)
typedef double CGFloat;
typedef struct { int x,y,w,h; } NSRect;
typedef NSRect CGRect;
typedef struct { int x,y; } NSPoint;
typedef NSPoint CGPoint;
typedef struct { int w,h; } NSSize;
typedef NSSize CGSize;
typedef unsigned long NSStringEncoding;
typedef long NSTimeInterval;
typedef void (^dispatch_block_t)(void);
typedef void * dispatch_queue_t;
@class NSString;
@protocol NSObject
- (NSInteger)retainCount;
- (id)retain;
- (oneway void)release;
- (id)autorelease;
- (Class)class;
- (Class)superclass;
- (id)init;
- (void)dealloc;
- (NSString *)description;
- (BOOL)isEqual:(id)object;
+ (id)alloc;
+ (Class)class;
@optional @end
@interface NSObject <NSObject> @end
@interface NSString : NSObject
+ (instancetype)stringWithFormat:(NSString *)fmt, ...;
- (NSUInteger)length;
@property(readonly) NSUInteger length;
@end
@interface NSArray : NSObject
+ (instancetype)array;
- (NSUInteger)count;
- (id)objectAtIndex:(NSUInteger)idx;
@end
@interface NSMutableArray : NSArray
+ (instancetype)array;
- (void)addObject:(id)obj;
@end
@interface NSDictionary : NSObject
+ (instancetype)dictionary;
- (id)objectForKey:(id)key;
@end
@interface NSData : NSObject
+ (instancetype)dataWithBytes:(const void *)b length:(NSUInteger)l;
@property(readonly) NSUInteger length;
@end
@interface NSError : NSObject
@property(readonly) NSString *localizedDescription;
@end
@interface NSBundle : NSObject
+ (NSBundle *)mainBundle;
@end
@interface NSUserDefaults : NSObject
+ (NSUserDefaults *)standardUserDefaults;
- (void)setObject:(id)obj forKey:(NSString *)key;
- (id)objectForKey:(NSString *)key;
@end
@interface NSFileManager : NSObject
+ (id)defaultManager;
@end
@interface NSDate : NSObject @end
@interface NSJSONSerialization : NSObject
+ (NSData *)dataWithJSONObject:(id)obj options:(NSUInteger)opt error:(NSError **)error;
+ (id)JSONObjectWithData:(NSData *)data options:(NSUInteger)opt error:(NSError **)error;
@end
@interface NSPropertyListSerialization : NSObject
+ (NSData *)dataWithPropertyList:(id)plist format:(NSUInteger)fmt options:(NSUInteger)opt error:(NSError **)error;
@end
extern NSString * NSStringFromSelector(SEL);
extern SEL NSSelectorFromString(NSString *);
extern Class NSClassFromString(NSString *);
extern void NSLog(NSString *fmt, ...);
#endif
FOUND

          # Create minimal UIKit.h
          mkdir -p "$SDK/System/Library/Frameworks/UIKit.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h" << 'UIKIT'
#ifndef _UIKIT_H
#define _UIKIT_H
#import <Foundation/Foundation.h>
typedef long UIViewAutoresizingMask;
typedef long UIStatusBarStyle;
typedef long NSTextAlignment;
typedef long UIButtonType;
typedef long UIActivityIndicatorViewStyle;
@class UIColor, UIFont, UIView, UIWindow, UIViewController;
@interface UIColor : NSObject
+ (UIColor *)colorWithRed:(CGFloat)r green:(CGFloat)g blue:(CGFloat)b alpha:(CGFloat)a;
@end
@interface UIFont : NSObject
+ (UIFont *)systemFontOfSize:(CGFloat)sz;
@end
@interface UIView : NSObject
- (void)addSubview:(UIView *)view;
- (instancetype)initWithFrame:(CGRect)frame;
@property CGRect frame;
@property CGRect bounds;
@property CGPoint center;
@property UIColor *backgroundColor;
@end
@interface UIScreen : NSObject
+ (UIScreen *)mainScreen;
@property CGRect bounds;
@end
@interface UIWindow : UIView
@property UIViewController *rootViewController;
- (void)makeKeyAndVisible;
@end
@protocol UIApplicationDelegate <NSObject>
@optional
- (BOOL)application:(id)app didFinishLaunchingWithOptions:(NSDictionary *)opts;
@end
@interface UIApplication : NSObject
@property id<UIApplicationDelegate> delegate;
+ (UIApplication *)sharedApplication;
@end
@interface UIResponder : NSObject @property id nextResponder; @end
@interface UIViewController : UIResponder
@property UIView *view;
- (void)viewDidLoad;
@end
@interface UINavigationController : UIViewController
- (instancetype)initWithRootViewController:(UIViewController *)vc;
@end
@interface UILabel : UIView
@property NSString *text;
@property UIFont *font;
@property UIColor *textColor;
@property NSTextAlignment textAlignment;
@end
@interface UIButton : UIView
+ (UIButton *)buttonWithType:(UIButtonType)type;
@end
@interface UIImage : NSObject
+ (UIImage *)imageNamed:(NSString *)name;
@end
@interface UIActivityIndicatorView : UIView
- (instancetype)initWithActivityIndicatorStyle:(UIActivityIndicatorViewStyle)style;
- (void)startAnimating;
@end
extern int UIApplicationMain(int, char **, NSString *, NSString *);
#endif
UIKIT

          mkdir -p "$SDK/System/Library/Frameworks/WebKit.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/WebKit.framework/Headers/WebKit.h" << 'WEBKIT'
#ifndef _WEBKIT_H
#define _WEBKIT_H
#import <UIKit/UIKit.h>
@protocol WKNavigationDelegate <NSObject> @optional
- (void)webView:(id)webView didFinishNavigation:(id)nav;
@end
@protocol WKScriptMessageHandler <NSObject>
- (void)userContentController:(id)uc didReceiveScriptMessage:(id)msg;
@end
@interface WKWebViewConfiguration : NSObject
@property id userContentController;
@end
@interface WKUserContentController : NSObject
+ (id)new;
- (void)addScriptMessageHandler:(id<WKScriptMessageHandler>)handler name:(NSString *)name;
@end
@interface WKWebView : UIView
@property id<WKNavigationDelegate> navigationDelegate;
- (instancetype)initWithFrame:(CGRect)frame configuration:(id)config;
- (void)loadHTMLString:(NSString *)html baseURL:(id)url;
@property NSString *title;
@end
WEBKIT

          mkdir -p "$SDK/System/Library/Frameworks/CoreTelephony.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/CoreTelephony.framework/Headers/CoreTelephony.h" << 'CORETEL'
#ifndef _CORETELEPHONY_H
#define _CORETELEPHONY_H
#import <Foundation/Foundation.h>
@interface CTCarrier : NSObject
@property(readonly) NSString *carrierName;
@end
@interface CTTelephonyNetworkInfo : NSObject
@property NSString *currentRadioAccessTechnology;
@end
CORETEL

          mkdir -p "$SDK/System/Library/Frameworks/CoreLocation.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/CoreLocation.framework/Headers/CoreLocation.h" << 'CORELOC'
#ifndef _CORELOCATION_H
#define _CORELOCATION_H
#import <Foundation/Foundation.h>
typedef struct { double lat; double lon; } CLLocationCoordinate2D;
@interface CLLocation : NSObject
@property(readonly) CLLocationCoordinate2D coordinate;
@end
@interface CLLocationManager : NSObject
@property id delegate;
- (CLLocation *)location;
- (void)startUpdatingLocation;
@end
CORELOC

          mkdir -p "$SDK/System/Library/Frameworks/AdSupport.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/AdSupport.framework/Headers/AdSupport.h" << 'ADSUP'
#ifndef _ADSUPPORT_H
#define _ADSUPPORT_H
#import <Foundation/Foundation.h>
@interface ASIdentifierManager : NSObject
+ (id)sharedManager;
@property(readonly) NSUUID *advertisingIdentifier;
@end
ADSUP

          mkdir -p "$SDK/System/Library/Frameworks/IOKit.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/IOKit.framework/Headers/IOKitLib.h" << 'IOKIT'
#ifndef _IOKITLIB_H
#define _IOKITLIB_H
#import <Foundation/Foundation.h>
typedef void * io_service_t;
extern io_service_t IOServiceGetMatchingService(int, void *);
extern void *IOServiceMatching(const char *);
IOKIT

          mkdir -p "$SDK/System/Library/Frameworks/MobileCoreServices.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/MobileCoreServices.framework/Headers/MobileCoreServices.h" << 'MCS'
#ifndef _MOBILECORESERVICES_H
#define _MOBILECORESERVICES_H
#import <Foundation/Foundation.h>
typedef const void * CFStringRef;
MCS

          mkdir -p "$SDK/System/Library/Frameworks/CoreMotion.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/CoreMotion.framework/Headers/CoreMotion.h" << 'COREM'
#ifndef _COREMOTION_H
#define _COREMOTION_H
@interface CMMotionManager : NSObject
- (BOOL)isAccelerometerAvailable;
@end
COREM

          mkdir -p "$SDK/System/Library/Frameworks/Metal.framework/Headers"
          cat > "$SDK/System/Library/Frameworks/Metal.framework/Headers/Metal.h" << 'METAL'
#ifndef _METAL_H
#define _METAL_H
@protocol MTLDevice <NSObject> @end
METAL

          # objc/runtime.h
          cat > "$SDK/usr/include/objc/runtime.h" << 'OBJC'
#ifndef _OBJC_RUNTIME_H
#define _OBJC_RUNTIME_H
#include <stddef.h>
#include <stdint.h>
typedef const char * SEL;
typedef void * id;
typedef struct objc_class *Class;
typedef void * Method;
typedef uintptr_t Ivar;
typedef int BOOL;
#define YES ((BOOL)1)
#define NO ((BOOL)0)
#define nil ((id)0)
typedef struct objc_object { void *isa; } *objc_object_t;
extern void *objc_msgSend(id, SEL, ...);
extern void *objc_msgSendSuper(void *, SEL, ...);
OBJC

          # Framework plists
          for fw in Foundation UIKit WebKit CoreTelephony CoreLocation AdSupport IOKit MobileCoreServices CoreMotion Metal; do
            mkdir -p "$SDK/System/Library/Frameworks/${fw}.framework/Resources"
            echo '<?xml version="1.0"?><plist version="1.0"><dict><key>WrapperExtension</key><string>framework</string></dict></plist>' > "$SDK/System/Library/Frameworks/${fw}.framework/Resources/Info.plist"
          done
          echo '<?xml version="1.0"?><plist version="1.0"><dict><key>SDKVersion</key><string>15.0</string></dict></plist>' > "$SDK/SDKInfo.plist"
          echo "SDK created at: $SDK"

      - name: Build tweak with Theos
        env:
          THEOS: $HOME/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd tweak
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1 | tail -30
          find . -name "*.deb" -type f

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb-ubuntu
          path: tweak/**/*.deb
          retention-days: 7
